<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ChatOS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap');
:root{--acc:#fff;--ink:#fff;--paper:#000;--r:255px 16px 225px 14px/16px 225px 14px 255px}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background-color:var(--paper);background-image:radial-gradient(var(--dot,#2a2a2a) 1px,transparent 1px);background-size:18px 18px;color:var(--ink);font:21px/1.35 'Patrick Hand',cursive,sans-serif}
button,input,textarea,select{font:inherit;color:var(--ink)}
button{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);padding:4px 14px;cursor:pointer;font-weight:700;box-shadow:3px 3px 0 var(--ink);display:inline-flex;align-items:center;gap:4px}
button:hover{animation:wob .35s ease}
button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
button:disabled{opacity:.35;cursor:default;box-shadow:none}
button.ghost{box-shadow:none;border-style:dashed}
button.danger{border-style:double;border-width:4px;box-shadow:none}
input,textarea,select{background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);padding:6px 12px;width:100%;outline:none}
input::placeholder,textarea::placeholder{color:var(--ink);font-style:italic}
input:focus,textarea:focus{box-shadow:3px 3px 0 var(--ink)}
.glass{border:2px solid var(--ink);border-radius:var(--r);background:var(--paper);padding:16px;box-shadow:4px 4px 0 var(--acc);transition:transform .2s}
.glass:hover{transform:rotate(-.25deg)}
.row{display:flex;gap:8px;align-items:center}
.muted{font-size:.85em;text-decoration:underline dotted;text-underline-offset:4px}
.hide{display:none!important}
.logo{display:flex;align-items:center;gap:10px;font-size:36px;font-weight:700}
.logo path{stroke-dasharray:80;stroke-dashoffset:80;animation:draw 2s ease forwards}
.grad{text-decoration:underline wavy;text-underline-offset:8px}
.demo{font-size:16px;border:2px dashed var(--ink);border-radius:99px;padding:0 12px;justify-self:start}
.ic{vertical-align:-4px;filter:url(#rough);flex:none}
#auth{min-height:100vh;display:grid;place-items:center;padding:20px}
#auth .glass{width:min(400px,100%);display:grid;gap:12px}
#app{display:grid;grid-template-columns:210px 1fr;height:100vh}
nav{border-right:2px dashed var(--ink);padding:18px;display:flex;flex-direction:column;gap:8px}
nav button{background:none;box-shadow:none;border:2px solid transparent;text-align:left;font-size:22px;padding:4px 10px}
nav button.on{border:2px solid var(--acc);border-radius:var(--r);box-shadow:3px 3px 0 var(--acc)}
main{overflow:auto;padding:22px}
.post{margin-bottom:16px}
.av{width:42px;height:42px;border:2px solid var(--acc);border-radius:50% 45% 55% 50%;display:grid;place-items:center;font-weight:700;font-size:22px;flex:none}
.msg{display:flex;margin:8px 0}
.msg.me{justify-content:flex-end}
.bub{padding:8px 12px;border:2px solid var(--ink);border-radius:var(--r);max-width:78%;word-break:break-word;background:var(--paper)}
.me .bub{box-shadow:3px 3px 0 var(--acc)}
.sp{background:var(--ink);color:var(--ink);border-radius:3px;padding:0 4px;cursor:pointer}
.sp:hover{background:transparent}
.mention{text-decoration:underline}.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);display:grid;place-items:center;z-index:20;padding:20px}.ov .glass{width:min(460px,100%);display:grid;gap:12px;max-height:90vh;overflow:auto}.tg{font-size:.8em;border-radius:99px;padding:0 9px;border:2px solid var(--ink);font-weight:700;color:#000}
code{border:1px dashed var(--ink);padding:0 5px;border-radius:4px;font-family:inherit}
.tag{font-size:.8em;border:2px solid var(--ink);border-radius:99px;padding:0 9px;font-weight:700}
img{border:2px solid var(--ink);border-radius:var(--r);max-width:100%}
textarea[readonly]{font-size:14px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--paper);border:2px solid var(--ink);padding:10px 18px;border-radius:var(--r);box-shadow:4px 4px 0 var(--ink);z-index:9;animation:tin .3s ease}
.fade{animation:fade .45s ease both}
.pop{animation:pop .4s ease}
.dots span{display:inline-block;animation:blink 1.2s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-1.5deg)}75%{transform:rotate(1.5deg)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes tin{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:700px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:100dvh}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:2px dashed var(--ink);padding:8px}nav button{white-space:nowrap}#logout{margin-top:0}}
.chb{width:100%;padding:14px;border-radius:24px;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,.04));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.45);box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.35)}
.chg{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1/1;border-radius:14px;overflow:hidden;border:1px solid rgba(255,255,255,.5)}
.chg button{position:relative;width:100%;height:100%;aspect-ratio:1/1;padding:0;margin:0;border:none;border-radius:0;box-shadow:none;background:none;display:grid;place-items:center;font-size:clamp(20px,7.5vw,56px);line-height:1;color:#fff;text-shadow:0 0 4px rgba(0,0,0,.8)}
.chg button:hover{animation:none}
.chg button:disabled{opacity:1}
.chg .sqL{background:rgba(205,230,250,.55)}
.chg .sqD{background:rgba(25,75,150,.6)}
.chg .sqH{background:rgba(255,236,120,.6)}
.chg .sqPb{color:#1d1d1d;text-shadow:0 0 3px rgba(255,255,255,.9)}
.chg .sqT::after{content:'';position:absolute;width:26%;height:26%;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 6px rgba(0,0,0,.4)}
.chg .cf,.chg .cr{position:absolute;font-style:normal;font-size:11px;font-weight:700;color:#fff;opacity:.85;text-shadow:none}
.chg .cf{right:3px;bottom:1px}.chg .cr{left:3px;top:1px}
.chc{font-size:22px;font-weight:700}
.chb{position:relative;overflow:hidden;width:100%;padding:10px;border-radius:16px;background:#222226;border:2px solid #4a4a52;box-shadow:0 14px 40px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.12)}
.chg{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1/1;border-radius:4px;overflow:hidden}
.chg .sqL{background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 45%),radial-gradient(circle at 30% 70%,rgba(255,255,255,.3),transparent 50%),#b4d3e8}
.chg .sqD{background:linear-gradient(200deg,rgba(255,255,255,.14),transparent 40%),radial-gradient(circle at 70% 30%,rgba(10,40,110,.5),transparent 55%),#1f4c8a}
.chg .sqH{background:#9b9058!important}
.chg .sqK{animation:chk 1s infinite}
.chg .sqM .pc{animation:mvin .35s ease}
.chg .pc{width:80%;height:80%;overflow:visible;stroke-width:1.6;stroke-linejoin:round;filter:url(#rough)}
.chg .cf,.chg .cr{color:#dfe9f5;opacity:.9;text-shadow:none}
.chc.low{color:#ff6b6b;animation:blink 1s infinite}
.cfx{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;animation:conf 2.6s linear forwards;pointer-events:none}
.live{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:livep 1.2s infinite;margin-right:6px}
@keyframes chk{0%,100%{box-shadow:inset 0 0 0 0 rgba(255,70,70,0)}50%{box-shadow:inset 0 0 0 5px rgba(255,70,70,.9)}}
@keyframes mvin{from{transform:translateY(-14px) scale(.7);opacity:.3}to{transform:none;opacity:1}}
@keyframes conf{to{transform:translateY(420px) rotate(720deg);opacity:0}}
@keyframes livep{0%,100%{opacity:1}50%{opacity:.25}}
</style></head>

<script>

const FT={welcome:'s',maxUsers:'n',resv:'s',schOff:'b',werkOff:'b',maintText:'s',goal:'n',title:'s',announce:'s',reg:'s',code:'s',maint:'b',feed:'b',chat:'b',friends:'b',maxKB:'n',slow:'n',maxLen:'n',muteMin:'n',bad:'s',key:'s',model:'s',sys:'s',aiRpm:'n'};
const $=s=>document.querySelector(s),M=$('#main'),F={u:$('#u'),p:$('#p'),sq:$('#sq'),sa:$('#sa'),np:$('#np'),inv:$('#inv')};

const ic=(n,s=20)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;
const LANGS={de:'Deutsch',en:'Englisch',fr:'Französisch',es:'Spanisch',it:'Italienisch',tr:'Türkisch',ar:'Arabisch',ru:'Russisch',pl:'Polnisch',ja:'Japanisch'};const TR={},PEND={};const RX=['like','heart','laugh','wow'];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){if(e&&e.name==='QuotaExceededError'){showWarn('Speicher voll. Bitte große Bilder oder Sprachnachrichten löschen und vorher als Datei sichern.')}else{showWarn('Speichern hat nicht geklappt. Die Daten gehen beim Neuladen verloren. Öffne die Seite direkt über ihre Adresse in einem neuen Tab.')}}};

const md=s=>{let t=String(s);db.cfg.bad.split(',').map(w=>w.trim()).filter(Boolean).forEach(w=>{t=t.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),'***')});return esc(t).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*(.+?)\*/g,'<i>$1</i>').replace(/\|\|(.+?)\|\|/g,'<span class="sp">$1</span>').replace(/@(\w+)/g,'<span class="mention">@$1</span>')};

const hash=async s=>{const b=new TextEncoder().encode(s);if(crypto.subtle){const d=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}let h=0;for(const c of b)h=(h*31+c)>>>0;return'fb'+h};
let teamImg='',me=null,tab='feed',dm=null,editId=null,img='',last=0,flash='',fresh='',lastTab='',sec='plat',aiT=[];

async function send(){const i=$('#mi'),x=(i?i.value:'').trim();if(!dm||(!x&&!patt)||gate())return;if(dm.startsWith('g:')){if(!(db.groups||[]).some(g=>'g:'+g.id===dm&&g.members.includes(me)))return toast('Du bist kein Mitglied dieser Gruppe.')}else if(dm!=='*'){const e=dmErr(dm);if(e)return toast(e)}if(x.length>db.cfg.maxLen)return toast('Max. '+db.cfg.maxLen+' Zeichen');const rec=db.msgs.filter(q=>q.f===me&&q.t===dm).slice(-3);if(x&&rec.length===3&&rec.every(q=>q.x===x))return toast('Bitte nicht dieselbe Nachricht wiederholen.');if((x.match(/https?:\/\//g)||[]).length>3)return toast('Zu viele Links in einer Nachricht.');if(i)i.value='';if(x.startsWith('/ai ')){const now=Date.now();aiT=aiT.filter(t=>now-t<6e4);if(aiT.length>=db.cfg.aiRpm)return toast('KI-Limit erreicht, bitte kurz warten.');aiT.push(now);const b=$('#aiBox');if(b)b.innerHTML=`<div class='glass'>KI denkt nach<span class='dots'><span>.</span><span>.</span><span>.</span></span></div>`;const a=await ask(x.slice(4));const c=$('#aiBox');if(c)c.innerHTML=`<div class='glass' style='white-space:pre-wrap'><b>KI (nur für dich):</b> ${md(a)}</div>`;return}const m={id:uid(),f:me,t:dm,x,ts:Date.now(),r:false};if(rep){m.re=rep;rep=null}if(patt){m.att=patt;patt=null}if(anonOn&&isMod()&&dm!=='*'&&!dm.startsWith('g:')){m.f='*team';m.by=me;m.anon=true}db.msgs.push(m);fresh=m.id;cmenu=false;save();render()}async function sendOld(){
 const i=$('#mi'),x=i.value.trim();if(!x||!dm||gate())return;if(dm!=='*'&&dmErr(dm))return toast(dmErr(dm));

 i.value='';

  const b=$('#aiBox');if(b)b.innerHTML='<div class="glass">KI denkt nach<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>';

 const id=uid();db.msgs.push({id,f:me,t:dm,x,ts:Date.now(),r:false});fresh=id;save();render();
}
